<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locado</title>
  <link rel="stylesheet" href="/public/styles.css">
 
</head>
<body>
  <header>
    <div class="container header-content">
      <a href="index.html" class="logo">Locado</a>
      <nav class="nav">
        <a href="#" class="nav-item"><i class="fas fa-home"></i> Главная</a>
        <a href="#" class="nav-item"><i class="fas fa-map-marked-alt"></i> Карта</a>
        <a href="#" class="nav-item"><i class="fas fa-heart"></i> Избранное</a>
        <a href="#" class="nav-item"><i class="fas fa-user"></i> Профиль</a>
      </nav>
    </div>

  </header>
  <div class="container">
    
    <div class="categories_column">
      <!-- Горизонтальный скролл категорий -->
      <div class="categories_menu">
        <div class="categories_scroll" id="categories-scroll">
          <a href="#" data-category="all" class="category-btn">
            <i class="fas fa-map-marker-alt"></i> Все места
          </a>
          <a href="#" data-category="park" class="category-btn">
            <i class="fas fa-tree"></i> Парки
          </a>
          <a href="#" data-category="museum" class="category-btn">
            <i class="fas fa-landmark"></i> Музеи
          </a>
          <a href="#" data-category="theater" class="category-btn">
            <i class="fas fa-theater-masks"></i> Театры
          </a>
          <a href="#" data-category="food" class="category-btn">
            <i class="fas fa-utensils"></i> Еда
          </a>
          <a href="#" data-category="photo" class="category-btn">
            <i class="fas fa-camera"></i> Фото
          </a>
        </div>
        <div class="categories_search-wrapper">
          <input type="text" class="search-input" id="categories-search-input" placeholder="Поиск по названию...">
          <button class="btn categories-clear-btn" id="categories-clear-btn">Очистить</button>
        </div>
      </div>
      
      <!-- Контейнер для карточек мест -->
      <div class="places-grid" id="places-container">
        <!-- Карточки будут добавляться через JS -->
      </div>
      <button class="btn invisible" id="show-more-btn">Показать ещё</button>
    </div>
  </div>

  <script src="/src/places.js">

  </script>
</body>
</html>

<!doctype html>
<!-- tools/og-image.html — шаблон картинки для превью ссылок (assets/og-image.jpg).
     Фото — только наши, с лицензией (assets/images/places). Пересобрать:
     node tools/og-image.mjs -->
<html lang="ru"><head><meta charset="utf-8">
<style>
  @font-face { font-family: Unbounded; src: url(../assets/fonts/unbounded-cyrillic-700-normal.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: Raleway; src: url(../assets/fonts/raleway-cyrillic-500-normal.woff2) format('woff2'); font-weight: 500; }
  html, body { margin: 0; }
  .og {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(ellipse 55% 70% at 100% 100%, rgba(255, 170, 110, 0.55), transparent 70%),
      radial-gradient(ellipse 40% 50% at 0% 100%, rgba(255, 200, 150, 0.45), transparent 70%),
      linear-gradient(160deg, #FFF8F1 0%, #FBE9DA 100%);
    font-family: Raleway, sans-serif; color: #2A2521;
  }
  .text { position: absolute; left: 72px; top: 58px; width: 560px; }
  .kicker { font: 700 18px/1 Unbounded; letter-spacing: .12em; color: #B93C05; }
  .logo { margin-top: 84px; font: 700 96px/1 Unbounded; letter-spacing: -.04em; color: #FF570A; }
  .title { margin-top: 34px; font: 700 34px/1.25 Unbounded; letter-spacing: -.03em; }
  .lead { margin-top: 26px; font-size: 22px; line-height: 1.45; color: #6B6259; }
  .photo {
    position: absolute; border: 8px solid #fff; border-radius: 26px; overflow: hidden;
    box-shadow: 0 24px 50px rgba(60, 25, 5, 0.22);
  }
  .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .photo--back { width: 300px; height: 372px; right: 64px; top: 58px; transform: rotate(4deg); }
  .photo--front { width: 250px; height: 300px; right: 252px; top: 262px; transform: rotate(-5deg); }
</style></head>
<body>
  <div class="og">
    <div class="text">
      <div class="kicker">МОСКВА</div>
      <div class="logo">Локадо</div>
      <div class="title">Куда пойти<br>под настроение</div>
      <div class="lead">Места, маршруты и подборки —<br>рассказанные простыми словами</div>
    </div>
    <div class="photo photo--back"><img src="../assets/images/places/vorontsovsky-park.jpg" alt=""></div>
    <div class="photo photo--front"><img src="../assets/images/places/novodevichy-prud.jpg" alt=""></div>
  </div>
</body></html>

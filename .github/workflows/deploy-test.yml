# Автозаливка на тестовый сайт (test.locado.ru): после каждого пуша в
# рабочую ветку Claude GitHub сам заливает сайт по FTP в папку поддомена.
# Основной сайт (locado.ru) не трогается — его по-прежнему заливают вручную.
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   TEST_FTP_SERVER   — FTP-сервер Бегета (в панели: раздел FTP)
#   TEST_FTP_USERNAME — отдельный FTP-доступ, у которого домашняя папка —
#   TEST_FTP_PASSWORD   папка тестового поддомена (не всего аккаунта!).
#                       Сам сайт лежит внутри неё в public_html
# Пока секретов нет, заливка просто пропускается.
#
# Залить вручную любую ветку: вкладка Actions → «Тестовый сайт» → Run workflow.
# Что сейчас на тесте — test.locado.ru/version.txt.

name: Тестовый сайт

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

# Две заливки подряд не мешают друг другу: новая ждёт, пока закончится старая
concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.TEST_FTP_SERVER }}
    steps:
      - name: Нет FTP-доступа — пропускаем
        if: env.FTP_SERVER == ''
        run: echo "Секреты TEST_FTP_* не заданы — заливка на тест пропущена"

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      # В секрет часто попадает адрес целиком: «ftp://сервер/», с пробелом или
      # переносом строки. FTP-заливке нужно голое имя сервера — чистим
      - name: Адрес FTP-сервера
        if: env.FTP_SERVER != ''
        run: |
          host=$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##')
          echo "::add-mask::$host"
          echo "FTP_HOST=$host" >> "$GITHUB_ENV"
          getent hosts "$host" > /dev/null || { echo "Сервер «$host» не находится. Проверь TEST_FTP_SERVER: нужно имя сервера из раздела FTP панели Бегета, без ftp:// и без папок"; exit 1; }

      # Метка версии: test.locado.ru/version.txt — какая ветка и коммит сейчас
      # на тесте и когда их залили. Создаётся только здесь, в репозитории её нет
      - name: Метка версии
        if: env.FTP_SERVER != ''
        run: |
          {
            echo "Ветка:  ${GITHUB_REF_NAME}"
            echo "Коммит: ${GITHUB_SHA::7} — $(git log -1 --format=%s)"
            echo "Залито: $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M') по Москве"
          } > version.txt
          cat version.txt

      # Заливает только изменённые файлы: список уже залитых хранится на
      # сервере в .ftp-deploy-sync-state.json. Кэш погоды (api/weather-cache.json)
      # создаёт сам сервер — его не трогаем
      - name: Залить на test.locado.ru
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.TEST_FTP_USERNAME }}
          password: ${{ secrets.TEST_FTP_PASSWORD }}
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            docs/**
            tools/**
            api/weather-cache.json
